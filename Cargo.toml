[package]
name = "esp"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
iroh = "1.0.3"
libc = "0.2.178"
minicbor = { version = "2.3.0", features = ["derive", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
iroh-relay = { version = "=1.0.3", features = ["server", "test-utils"] }
tokio = { version = "1.53.1", features = ["test-util"] }

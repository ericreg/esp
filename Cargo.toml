[package]
name = "esp"
version = "0.1.0"
edition = "2024"

[features]
default = ["video-asm"]
video = ["dep:zbus", "dep:video-drm"]
video-codec = ["video", "dep:rav1e", "dep:rav1d", "dep:libloading"]
# Weak dependency features keep SSH-only builds free of codecs.
video-asm = ["rav1e?/asm", "rav1d?/asm", "rav1d?/asm_arm64_dotprod", "rav1d?/asm_arm64_i8mm", "rav1d?/asm_arm64_sve2"]
video-viewer = ["video-codec", "dep:winit", "dep:softbuffer", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
iroh = "1.0.3"
libc = "0.2.178"
minicbor = { version = "2.3.0", features = ["derive", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4"] }
winit = { version = "=0.30.13", optional = true }
softbuffer = { version = "=0.4.8", optional = true }

rav1e = { version = "=0.8.1", optional = true, default-features = false, features = ["threading"] }
# Includes the ARM assembly headers and the decode-error cleanup panic fix.
rav1d = { version = "=1.1.0", optional = true, git = "https://github.com/memorysafety/rav1d", rev = "6c6f463785a546dea18fd9ca0f14634c2ee0557c", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.8", optional = true }
video-drm = { version = "=0.14.1", package = "drm", optional = true }
zbus = { version = "=5.19.0", optional = true, default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.2.2", optional = true, default-features = false, features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "=0.2.2", optional = true, default-features = false, features = ["NSGeometry"] }

[dev-dependencies]
iroh-relay = { version = "=1.0.3", features = ["server", "test-utils"] }
tokio = { version = "1.53.1", features = ["test-util"] }
